<script>
const ns="http://www.w3.org/2000/svg";
const a=document.getElementById("anillos1");
for(let i=0;i<16;i++){const e=document.createElementNS(ns,"ellipse");const r=10+i*9;e.setAttribute("cx",120+Math.sin(i)*3);e.setAttribute("cy",90+Math.cos(i*1.3)*3);e.setAttribute("rx",r*1.12);e.setAttribute("ry",r*0.92);e.setAttribute("transform",`rotate(${-10+i*2} 120 90)`);a.appendChild(e);}
const t=document.getElementById("trama2");
for(let y=6;y<180;y+=9){for(let x=6;x<240;x+=9){const d=Math.hypot(x-120,y-90);const r=Math.max(0,3.6-d/38);if(r>0.35){const c=document.createElementNS(ns,"circle");c.setAttribute("cx",x+((y/9)%2?4.5:0));c.setAttribute("cy",y);c.setAttribute("r",r.toFixed(2));c.setAttribute("fill-opacity","0.55");t.appendChild(c);}}}
const n=document.getElementById("red3");let s=7;const rnd=()=>{s=(s*9301+49297)%233280;return s/233280;};
for(let i=0;i<46;i++){const ang=rnd()*Math.PI*2;const rad=34+rnd()*72;const x=120+Math.cos(ang)*rad*1.25,y=90+Math.sin(ang)*rad*0.85;const l=document.createElementNS(ns,"line");l.setAttribute("x1",x);l.setAttribute("y1",y);l.setAttribute("x2",120);l.setAttribute("y2",90);l.setAttribute("stroke","#1E3BFF");l.setAttribute("stroke-opacity","0.5");l.setAttribute("stroke-width","0.8");n.appendChild(l);const c=document.createElementNS(ns,"circle");c.setAttribute("cx",x);c.setAttribute("cy",y);c.setAttribute("r",(1.6+rnd()*2.6).toFixed(1));c.setAttribute("fill","#F4F2EC");n.appendChild(c);}
</script>
